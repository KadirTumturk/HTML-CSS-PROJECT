<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>FocusFrame</title>
  </head>
  <body>
    <section class="our-mentors">
      <div class="container">
        <h2 class="our-mentors-title">
          Our <span class="our-mentors-title-mentors">Mentors</span>
        </h2>
        <ul class="our-mentors-list">
          <li class="our-mentors-list-item">
            <img
              srcset="
                ./images/emilia_smith.png    1x,
                ./images/emilia_smith@2x.png 2x
              "
              alt="Mentor 1"
              class="our-mentors-list-item-image"
              width="180px"
              height="180px"
            />
            <h3 class="our-mentors-list-item-name">Emilia Smith</h3>
            <p class="our-mentors-list-item-description">
              1.5 years of experience
            </p>
          </li>
          <li class="our-mentors-list-item">
            <img
              srcset="
                ./images/alex_lebedev.png    1x,
                ./images/alex_lebedev@2x.png 2x
              "
              alt="Mentor 2"
              class="our-mentors-list-item-image"
              width="180px"
              height="180px"
            />
            <h3 class="our-mentors-list-item-name">Alex Lebedev</h3>
            <p class="our-mentors-list-item-description">
              3.5 years of experience
            </p>
          </li>
          <li class="our-mentors-list-item">
            <img
              srcset="
                ./images/mia_dubrovska.png    1x,
                ./images/mia_dubrovska@2x.png 2x
              "
              alt="Mentor 3"
              class="our-mentors-list-item-image"
              width="180px"
              height="180px"
            />
            <h3 class="our-mentors-list-item-name">Mia Dubrovska</h3>
            <p class="our-mentors-list-item-description">
              2.0 years of experience
            </p>
          </li>
          <li class="our-mentors-list-item">
            <img
              srcset="
                ./images/eliot_kovalev.png    1x,
                ./images/eliot_kovalev@2x.png 2x
              "
              alt="Mentor 4"
              class="our-mentors-list-item-image"
              width="180px"
              height="180px"
            />
            <h3 class="our-mentors-list-item-name">Eliot Kovalev</h3>
            <p class="our-mentors-list-item-description">
              4.0 years of experience
            </p>
          </li>
        </ul>
      </div>
    </section>
  </body>
</html>
